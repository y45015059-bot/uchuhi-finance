
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙飛融資</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#05091c;color:#fff;text-align:center}
header{padding:50px 20px 30px;background:radial-gradient(circle at top,#183b75,#05091c 70%)}
.tag{color:#63eaff;letter-spacing:3px;font-size:12px}
h1{font-size:36px;margin:18px 0;color:#fff;text-shadow:0 0 20px #168cff}
p{line-height:1.9;color:#c8d6f4}
section{padding:25px 20px;max-width:600px;margin:auto}
.panel{border:1px solid #245da8;border-radius:18px;padding:22px;margin:16px 0;background:#0b1530}
h2{color:#63eaff;font-size:21px}
a{display:inline-block;background:#12cce8;color:#061126;text-decoration:none;padding:14px 24px;border-radius:30px;font-weight:bold;margin-top:15px}
footer{padding:25px;color:#8192b8;font-size:12px}
</style>
</head>
<body>
<header>
<div class="tag">YOUR FUTURE STARTS HERE</div>
<h1>宇宙飛融資</h1>
<p>あなたの未来へ、新しい選択肢を。</p>
<a href="#info">サービス案内を見る</a>
</header>
<section id="info">
<div class="panel">
<h2>ABOUT</h2>
<p>宇宙飛融資のご案内ページです。<br>サービス内容・条件をご確認のうえ、ご相談ください。</p>
</div>
<div class="panel">
<h2>ご利用前に</h2>
<p>融資の可否・金額・条件は審査等により異なります。契約条件や返済総額を事前にご確認ください。</p>
</div>
<div class="panel">
<h2>お問い合わせ</h2>
<p>お問い合わせ窓口の準備中です。<br>個人情報をこのページに入力しないでください。</p>
</div>
</section>
<footer>© 宇宙飛融資</footer>
</body>
<section style="max-width:480px;margin:30px auto;padding:20px;border:1px solid #ddd;border-radius:12px;font-family:sans-serif;">
  <h2>お問い合わせフォーム</h2>
  <p>必要事項を入力してください。</p>

  <form>
    <label>🐅 名前（漢字）</label>
    <input type="text" name="name" autocomplete="name" required style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>🐅 フリガナ</label>
    <input type="text" name="furigana" required style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>🐅 生年月日（昭和・平成など）</label>
    <input type="text" name="birthdate" placeholder="例：平成○年○月○日" required style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>🐅 住所</label>
    <input type="text" name="address" autocomplete="street-address" required style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>🐅 本人電話番号</label>
    <input type="tel" name="phone" autocomplete="tel" required style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>👑 勤め先</label>
    <input type="text" name="employer" style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>👑 副業</label>
    <input type="text" name="sidejob" style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>👑 勤め先の電話番号</label>
    <input type="tel" name="workphone" style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>💸 給料日</label>
    <input type="text" name="payday" placeholder="例：毎月25日" style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>💸 手取り額</label>
    <input type="text" name="income" placeholder="例：月○万円" style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

    <label>💸 他社借入</label>
    <select name="otherloans" style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">
      <option value="">選択してください</option>
      <option>なし</option>
      <option>あり</option>
    </select>

    <label>過去トラブルや遅れはありますか？</label>
    <select name="pastissues" style="display:block;width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">
      <option value="">選択してください</option>
      <option>なし</option>
      <option>あり</option>
      <option>回答を控える</option>
    </select>

    <button type="button" style="width:100%;padding:14px;background:#2563eb;color:white;border:0;border-radius:8px;">入力内容を確認</button>
  </form>
</section>



</html>
